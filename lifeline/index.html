<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161C;--card:#1B242D;--ink:#EAF0F5;--mute:#A3AFBD;--line:#2B3744}}

:root[data-stage=baby]{--accent:#D99A00}
:root[data-stage=teen]{--accent:#D9477F}

*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center;transition:background .6s}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative}
header{padding:16px 18px 10px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.5px;color:var(--accent);transition:color .6s}
.sub{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;gap:12px;align-items:center}
.av{width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden;transition:background .6s}
.cash{font-weight:800;font-size:22px;text-align:right}.neg{color:var(--red)}
#snd{padding:4px 8px;font-size:14px;margin-top:4px}
.bars{padding:0 18px 8px;display:grid;gap:7px}
.lab{display:flex;align-items:center;gap:6px}.lab img{flex:none}
.row{display:grid;grid-template-columns:62px 1fr 30px;gap:8px;align-items:center;font-size:14px}
.tr{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:6px;transition:width .35s}
#acts{padding:0 18px 6px;font-size:13px}
#feed{flex:1;overflow-y:auto;padding:4px 18px 12px}
.e{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.e b{flex:none;min-width:44px;font-weight:800;color:var(--accent)}
.e span{flex:1}
nav{display:flex;gap:10px;padding:12px 18px 16px;background:var(--card);border-top:1px solid var(--line)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;background:var(--bg);color:var(--ink);font-weight:600}
button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
#up{flex:1;background:var(--accent);color:#fff;font-weight:800;font-size:18px;transition:background .6s}
#m{position:absolute;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;z-index:10}
#m[hidden]{display:none}
.p{width:100%;max-height:85%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:22px 18px;display:grid;gap:9px}
.p h2{margin:0;font-size:24px;font-weight:800;color:var(--accent)}.p p,.p div{margin:0 0 4px;color:var(--mute)}
.p button{text-align:left}.p button small{display:block;font-weight:400;color:var(--mute)}
.cf{position:fixed;top:-12px;width:8px;height:12px;z-index:50;animation:fall 1.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#app.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* World screen: pixel art, scaled up with crisp edges. */
#scene{width:100%;aspect-ratio:16/9;height:auto;display:block;image-rendering:pixelated;border-bottom:3px solid var(--line);background:#7fd3ff}

// Fills in fields that older saves do not have.
function fill(){if(!S)return;
const d={look:{skin:SKINS[0],hair:HAIRS[0],shirt:SHIRTS[0]},remote:false,subs:false,cap:null,pet:null,goal:null,wx:'Sunny',ill:null,rep:50,ret:0,hold:{},mkt:{},nwh:[],hob:{guitar:0,chess:0,painting:0,football:0},bigwin:0,won:0,seen:{},log:[],kd:[],cause:null,trait:'Sunny',path:null};

// ---------- face: eyes, eyelids, gaze, brows, nose, curved mouth, breathing ----------
let FACE=null;
function enhanceFace(){
const skinM=HEAD.material;
const whiteM=new THREE.MeshStandardMaterial({color:0xf4f4f4,roughness:.2});
const irisM=new THREE.MeshStandardMaterial({color:0x5a3b1e,roughness:.3});
const pupilM=new THREE.MeshStandardMaterial({color:0x050505,roughness:.2});
const browM=new THREE.MeshStandardMaterial({color:0x2a1d12,roughness:.9});
const part=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);SCN.add(m);return m};
EYES.forEach(e=>e.visible=false);MOUTH.visible=false;
FACE={eyes:[],brows:[],lids:[],blinkT:-1,nextBlink:2,gaze:new THREE.Vector2(),gazeTo:new THREE.Vector2(),nextGaze:0,moodKey:-99,mouth:null};
[-1,1].forEach(side=>{
const x=side*.35;
part(new THREE.SphereGeometry(.12,24,16),whiteM,x,.2,.86);
const iris=part(new THREE.SphereGeometry(.068,20,14),irisM,x,.2,.935);
const pupil=part(new THREE.SphereGeometry(.03,12,10),pupilM,x,.2,.99);
const lid=part(new THREE.SphereGeometry(.135,24,16),skinM,x,.2,.86);lid.scale.y=.02;
FACE.eyes.push({x,iris,pupil});FACE.lids.push(lid);
FACE.brows.push(part(new THREE.BoxGeometry(.3,.055,.06),browM,x,.42,.93));
});
part(new THREE.SphereGeometry(1,16,12),skinM,0,-.05,.98).scale.set(.07,.1,.08);
FACE.mouth=part(new THREE.BoxGeometry(.01,.01,.01),new THREE.MeshStandardMaterial({color:0x8a2b2b,roughness:.5}),0,0,0);
faceMood();
}
// Mouth curve and brows follow happiness.
function faceMood(){
if(!FACE||!S)return;
const k=Math.max(-1,Math.min(1,(S.happy-50)/50)),key=Math.round(k*4);
if(key!==FACE.moodKey){FACE.moodKey=key;const pts=[];
for(let i=-5;i<=5;i++){const x=i*.05,y=-.42+key/4*.9*x*x;pts.push(new THREE.Vector3(x,y,Math.sqrt(Math.max(0,1-x*x-y*y))+.01))}
const g=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),16,.022,8,false);
FACE.mouth.geometry.dispose();FACE.mouth.geometry=g}
const sad=S.happy<35,happy=S.happy>70;
FACE.brows.forEach((b,i)=>{const side=i?1:-1;b.rotation.z=sad?-side*.25:0;b.position.y=.42+(happy?.03:0)-(sad?.02:0)});
}
// Blinking, looking around, and breathing. Reduced motion turns the movement off.
function faceTick(now){
if(!FACE)return;
const t=now/1000,calm=RM;
if(calm){FACE.lids.forEach(l=>l.scale.y=.02);FACE.gazeTo.set(0,0)}
else{
if(FACE.blinkT<0&&t>FACE.nextBlink)FACE.blinkT=t;
let c=0;
if(FACE.blinkT>=0){const d=(t-FACE.blinkT)/.18;if(d>=1){FACE.blinkT=-1;FACE.nextBlink=t+2+Math.random()*4}else c=Math.sin(d*Math.PI)}
FACE.lids.forEach(l=>l.scale.y=Math.max(.02,c));
if(t>FACE.nextGaze){FACE.gazeTo.set((Math.random()-.5)*2,(Math.random()-.5)*1.2);FACE.nextGaze=t+1+Math.random()*2.5}
}
FACE.gaze.lerp(FACE.gazeTo,calm?1:.12);
FACE.eyes.forEach(e=>{e.iris.position.x=e.x+FACE.gaze.x*.035;e.iris.position.y=.2+FACE.gaze.y*.03;e.pupil.position.x=e.iris.position.x;e.pupil.position.y=e.iris.position.y});
SHIRT.scale.y=1+(calm?0:Math.sin(t*1.6)*.01);
}
function loopPortrait(now){if(RND&&S&&S.look&&FACE){faceTick(now);RND.render(SCN,CAM)}requestAnimationFrame(loopPortrait)}

function age(){

if(a==5)log('You started school.');

if(S.col>0){S.col--;ch({smarts:4});if(!S.col){S.edu=2;log('You graduated college.')}}
if(a>=18)ch({cash:-(12000+(S.car?1200:0))});
if(S.debt>0){const i=Math.round(S.debt*.03),p=Math.min(S.debt+i,15000);S.debt=S.debt+i-p;ch({cash:-p});if(S.debt<=0)log('Year '+a+': the mortgage is paid off.')}
if(S.home)S.home.v=Math.round(S.home.v*1.03);
if(S.car)S.car.v=Math.round(S.car.v*.9);
if(S.cash>0)ch({cash:Math.round(S.cash*.01)});
if(S.ret>0)S.ret=Math.round(S.ret*1.04);
STOCKS.forEach(k=>{const s=S.mkt[k];s.p=Math.max(5,Math.round(s.p*(.7+R(70)/100)))});
HOBBIES.forEach(k=>{if(S.hob[k]>=5&&R(3)==0){ch({cash:600});log(cap(k)+' gig paid $600.')}});
if(S.ill){S.ill.t--;ch({health:-6});if(S.ill.t<=0){log('You recovered from '+S.ill.n+'.');S.ill=null}}
else if(R(100)<6){S.ill={n:P(['the flu','bronchitis','a broken arm']),t:R(2)+2};log('You came down with '+S.ill.n+'.')}
if(S.pet){S.pet.a++;S.pet.h=cl(S.pet.h-R(10));ch({cash:-200});
if(S.pet.a>12||S.pet.h<=0){log('Your pet '+S.pet.n+' passed away. You buried them under the apple tree.');ch({happy:-10});S.pet=null}}
if(S.prob>0)S.prob--;
if(S.jail>0){S.jail--;ch({happy:-3,health:-2});log('Year '+a+': spent in prison.'+(S.jail?'':' You were released.'))}
else if(S.job){const p=pay()*(leave?.5:1);ch({cash:p});S.yrs++;log('Year '+a+': earned '+fmt(p)+' as a '+tt()+'.');if(S.lvl<3&&S.smarts>50&&R(100)<15){S.lvl++;log('Promoted to '+tt()+'!')}}
else if(a>=65&&S.yrs>0){const p=Math.min(30000,S.yrs*800);ch({cash:p});log('Year '+a+': pension paid '+fmt(p)+'.')}
else if(a>=18)log('Year '+a+': spent on living costs.');
if(S.path!=null&&PATHS[S.path]){const p=PATHS[S.path];ch({cash:p[2],happy:p[3],rep:p[4]});if(R(100)<p[5]){ch({cash:p[7],happy:p[8]});log(p[6])}}
if(S.gp>0)S.gp--;
if(S.gp>=3){ch({cash:-(R(4)+1)*1000,happy:-4});log('Year '+a+': gambling losses hit hard.')}
if(a>40)ch({health:-(R(4)+(a>60?3:0))});
if(S.cash<0)ch({happy:-4});
if(S.partner)ch({happy:2});
S.kd=S.kd.map(x=>x+1);ch({cash:-2500*S.kd.filter(x=>x<18).length});
if(a>55&&S.mom&&R(100)<(a-55)){S.mom=0;ch({happy:-15});log('Your mother passed away.')}
if(a>58&&S.dad&&R(100)<(a-55)){S.dad=0;ch({happy:-15});log('Your father passed away.')}
if(a>70&&R(100)<(a-70)*4){S.health=0;S.cause='old age'}
if(S.subs)ch({cash:-300});
ch({happy:2,cash:-200});log('Year '+a+': holiday season, gifts and family time.');
if((a==40||a==65)&&S.rep>=60){ch({happy:8});log('You won a community award.')}
if(S.cap&&a>=S.cap.at){log('Your time capsule opened: "'+S.cap.t+'"');S.cap=null}
if(S.goal&&S.cash>=S.goal.t){ch({happy:10});log('You reached your savings goal of '+fmt(S.goal.t)+'!');S.goal=null}
S.nwh.push(Math.round(nw()));if(S.nwh.length>80)S.nwh.shift();
const pool=EV.filter((e,i)=>a>=e.a[0]&&a<=e.a[1]&&!S.seen[i]&&(!e.j||S.job)&&(!e.w||e.w()));
if(pool.length&&R(100)<70){const e=P(pool);S.seen[EV.indexOf(e)]=1;sceneEvent(e.t);draw();ui(e.t,e.x,e.c.map(([l,f])=>[l,f]))}
else{ch({happy:R(5)-2});if(a<5)log('Year '+a+': you grew and learned new things.')}
draw();dead()}

function dead(){
if(!S||!S.alive)return;
if(S.health<=0||S.age>=105){S.alive=false;G.h.unshift({n:S.name,a:S.age,j:S.job?S.job.n:'None',p:S.peak});G.h=G.h.slice(0,12);G.slots[SL]=null;sv();
const why=S.age>=105?'old age':(S.cause||'poor health');
ui('Life over','You died at '+S.age+' from '+why+'.',[]);
const m=$('m').firstChild;
m.insertAdjacentHTML('beforeend','<div>Education: '+['none','high school','college degree'][S.edu]+'. Last job: '+(S.job?S.job.n:'none')+'. Peak savings: '+fmt(S.peak)+'. Net worth: '+fmt(nw())+'. Criminal record: '+S.record+'.</div>');
const b=document.createElement('button');b.textContent='Back to the start';b.onclick=()=>{$('m').hidden=true;splash()};m.appendChild(b);
shake()}}

function play(g,b){
if(S.cash<b)return 'You cannot cover that bet.';
if(!spend())return NOACT;
S.gp++;ch({cash:-b});
if(g=='slots'){if(R(6)==0){ch({cash:b*5});if(b>=2000)S.bigwin=1;return 'Jackpot! The slots paid '+fmt(b*5)+'.'}return 'The reels missed. You lost '+fmt(b)+'.'}
if(g=='roulette'){if(R(37)<18){ch({cash:b*2});if(b>=2000)S.bigwin=1;return 'Red came up. You won '+fmt(b)+'.'}return 'Black came up. You lost '+fmt(b)+'.'}
const r=R(100);
if(r<42){ch({cash:b*2});if(b>=2000)S.bigwin=1;return 'You beat the dealer and won '+fmt(b)+'.'}
if(r<50){ch({cash:b});return 'A push. Your bet came back.'}
return 'The dealer won. You lost '+fmt(b)+'.'}

if(S.kd.length)it.push(['Spend time with your kids','',A(()=>{ch({happy:8,cash:-100});return 'You had a family day out.'})]);
if(S.pet)it.push(['Play with '+S.pet.n,'Keeps your pet happy',A(()=>{S.pet.h=cl(S.pet.h+8);ch({happy:4});return 'You and '+S.pet.n+' played in the park.'})]);
else it.push(['Adopt a pet · $300','A friend for life',A(()=>{if(S.cash<300)return 'You cannot afford a pet.';ch({cash:-300,happy:8});S.pet={n:P(PETS),a:0,h:80};return 'You adopted '+S.pet.n+'.'})]);
if(!it.length)return ui('Family','Nobody is around right now.',[['OK']]);

function love(){
const it=[];
if(S.age<16){ui('Love','You are too young for this.',[['OK']]);return}
if(!S.partner)it.push(['Go on a date','',A(()=>{if(S.looks+R(60)>60){S.partner=P(ALL);ch({happy:10});return 'You started dating '+S.partner+'.'}ch({happy:-4});return 'The date did not go well.'})]);
else{
it.push(['Spend quality time','',A(()=>{ch({happy:8,cash:-100});return 'You had a lovely evening with '+S.partner+'.'})]);
if(!S.married&&S.age>=20)it.push(['Propose','',A(()=>{if(R(3)){S.married=true;ch({happy:15,cash:-5000});return S.partner+' said yes. You married.'}ch({happy:-8});return S.partner+' said no.'})]);

it.push(['Break up','',A(()=>{const p=S.partner,m=S.married;S.partner=null;S.married=false;ch({happy:-10,cash:m?-3000:0});return 'You and '+p+' split up.'+(m?' The divorce cost $3,000.':'')})]);}
menu('Love',it,'Each choice uses an action.')}

function prison(){ui('Prison',S.jail+' year(s) left. Each choice uses an action.',[

['Study in the library',A(()=>{ch({smarts:5});return 'You studied in the library.'})],
['Prison workshop · earn $200','Work program',A(()=>{ch({cash:200,happy:-1});return 'You earned $200 in the prison workshop.'})],
['Prison education course','Helps you get hired later',A(()=>{S.pedu=1;ch({smarts:4});return 'You finished a prison education course.'})],
['Request parole','Odds depend on your record and mood',A(()=>{const p=Math.max(10,Math.min(80,30+S.happy/2-S.record*5));if(R(100)<p){S.jail=0;S.prob=2;return 'The parole board agreed. You are free on probation for 2 years.'}ch({happy:-5});return 'The parole board said no.'})],
['Attempt an escape',A(()=>{if(R(10)==0){S.jail=0;S.record++;return 'You escaped and are on the run!'}S.jail+=2;ch({happy:-10});return 'Caught. Two more years added.'}),'Very risky'],
['Close']])}

function mystery(){menu('Mystery box',[['Open it · $200','One random stat boost',A(()=>{if(S.cash<200)return 'You cannot afford the box.';ch({cash:-200});const k=P(['health','happy','smarts','looks']),v=R(15)+5;ch({[k]:v});return 'The box held a boost: +'+v+' '+k+'.'})]],'Each choice uses an action.')}

// ---------- achievements, history ----------
const AC=[['Millionaire','Hold $1,000,000',()=>S.cash>=1e6,'legendary'],['Scholar','Earn a degree',()=>S.edu==2,'rare'],['Parent','Have a child',()=>S.kids>0,'common'],['Married','Get married',()=>S.married,'common'],['Jailbird','Go to prison',()=>S.jailed,'common'],['Veteran','Live to 90',()=>S.age>=90,'rare'],['Top rank','Reach the top of a career',()=>S.job&&S.lvl==3,'rare'],['Lucky','Win the lottery',()=>S.won,'rare'],['Orphaned','Lose both parents',()=>!S.mom&&!S.dad,'common'],['Homeowner','Buy a home',()=>!!S.home,'common'],['Driver','Own a car',()=>!!S.car,'common'],['High roller','Win a $2,000 casino bet',()=>!!S.bigwin,'legendary']];
function chk(){AC.forEach(([n,d,f])=>{if(!G.a[n]&&f()){G.a[n]=1;sv();log('Achievement unlocked: '+n);confetti()}})}
function ach(){ui('Achievements',Object.keys(G.a).length+' of '+AC.length+' unlocked.',AC.map(([n,d,f,r])=>[(G.a[n]?'✓ ':'○ ')+n+' · '+r,null,d]).concat([['Close']]))}
function hist(){ui('Life history',G.h.length?'':'No finished lives yet.',G.h.map(x=>[x.n+' · lived '+x.a+' years',null,(x.j||'None')+' · peak '+fmt(x.p)]).concat([['Close']]))}

// ---------- start, slots, save codes ----------
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function importCode(){const txt=prompt('Paste a save code:');if(!txt)return;

SL=G.slots.findIndex(s=>!s);if(SL<0)SL=0;G.slots[SL]=o;S=o;fill();sv();return 'Save imported into slot '+(SL+1)+'.'}
catch(e){S=null;return 'That save code did not work.'}}
function resume(){S=G.slots[SL];fill();return null}
function start(g,i,p){const t=TRAITS[i];
S={g,name:P(NAMES[g]),age:0,trait:t[0],health:70+R(30),happy:60+R(40),smarts:30+R(60),looks:30+R(60),rep:50,cash:0,debt:0,home:null,car:null,lic:false,ret:0,
look:{skin:P(SKINS),hair:P(HAIRS),shirt:P(SHIRTS)},mkt:{},hold:{},hob:{guitar:0,chess:0,painting:0,football:0},ill:null,nwh:[],wx:'Sunny',acts:MAX_ACTS,job:null,lvl:0,edu:0,col:0,partner:null,married:false,record:0,peak:0,yrs:0,jail:0,jailed:0,won:0,bigwin:0,kids:0,kd:[],preg:false,gp:0,
sibs:R(3),mom:1,dad:1,alive:true,cause:null,seen:{},log:[],remote:false,subs:false,cap:null,pet:null,goal:null,path:p};
fill();
S[t[2]]=cl(S[t[2]]+10);
log('You were born. Welcome, '+S.name+'. Trait: '+t[0]+'.');
G.slots[SL]=S;sv();return null}
function pickTrait(g){ui('Pick a trait','This shapes your start.',TRAITS.map((t,i)=>[t[0],()=>pickPath(g,i),t[1]]))}
function pickPath(g,i){const pick=PATHS.map((_,k)=>k).sort(()=>Math.random()-.5).slice(0,3);
ui('Pick a life path','Each year it pays out, and sometimes something happens.',pick.map(pi=>[PATHS[pi][0],()=>start(g,i,pi),PATHS[pi][1]]))}
function pickGender(){ui('Who are you?','Your start shapes some events.',[['Girl',()=>pickTrait('f')],['Boy',()=>pickTrait('m')],['Something else',()=>pickTrait('x')]])}
function splash(){S=null;
ui('LIFELINE','Live a whole life in a few minutes. Pick a save slot.',
G.slots.map((s,i)=>[s?s.name+' · age '+s.age:'Slot '+(i+1)+' · empty',()=>{SL=i;if(G.slots[i])return resume();pickGender();return null},s?'Continue':'Start a new life'])
.concat([['Import a save code',importCode]]))}

// ---------- wire up ----------
$('act').onclick=()=>{if(!S||!S.alive)return;if(S.jail>0)return prison();
menu('Activities',[
['Career','Jobs, promotions, school',career],
['Hobbies','Practise and level up',hobbies],
['Family','Parents, siblings, kids, pets',fam],
['Love','Dating, marriage, family',love],
['Money','Lottery, investing, stocks, retirement',money],
['Home and car','Buy, sell, pay down',assets],
['Casino','Games of chance',casino],
['Community','Volunteer, quiz night',community],
['Crime','High risk, high reward',crime],
['Health','Look after yourself',health],
['Profile','See your character',profile],
['Mystery box · $200','A random stat boost',mystery],
['Time capsule','Write a note for ten years from now',capsule],
['Stats','Net worth over time',stats],
['Achievements','',ach],
['Life history','',hist],
['Save code','Copy this life to another device',()=>{prompt('Your save code:',code())}]],S.acts+' of '+MAX_ACTS+' actions left this year.')};
$('up').onclick=age;
$('snd').onclick=()=>{G.mute=!G.mute;$('snd').textContent=G.mute?'🔇':'🔊';sv()};
$('snd').textContent=G.mute?'🔇':'🔊';
buildPortrait();requestAnimationFrame(sceneLoop);splash();
</script>

<script>

'🤝 Connections':[['Call a friend',0,1,'social',25,'friendship',6],['Host a potluck',20,3,'social',40,'hosting',16],['Meet neighbours',0,1,'social',20,'community',6],['Board-game night',5,2,'social',30,'strategy',6],['Resolve a disagreement',0,2,'social',25,'empathy',10],['Write a thank-you',0,1,'social',15,'empathy',6]],

function life(){if(!S)return null;return S.life||(S.life={day:1,hour:8,city:'Auckland',place:'Home',food:75,energy:80,hygiene:75,social:65,calm:70,skills:{},done:{},condition:null,care:false,streak:0})}
const baseDraw=draw;draw=function(){baseDraw();if(!S)return;const l=life();let bar=$('lifebar');if(!bar){bar=document.createElement('div');bar.id='lifebar';bar.className='lifebar';$('scene').after(bar)}bar.textContent=`Day ${l.day} · ${l.hour}:00 · Food ${l.food} · Energy ${l.energy} · Hygiene ${l.hygiene} · Social ${l.social} · Calm ${l.calm}`;sv()};

function perform(g,i){const a=DAILY[g][i],l=life();if(!S.alive||S.jail)return 'This activity is unavailable.';if(S.age<a[6])return 'Try this when you are older; recovery and self-care are available now.';if(l.hour+a[2]>22)return 'It is late. Sleep before starting this activity.';if(a[1]>S.cash)return 'You need more spending money for this.';if(l.energy<12&&a[3]!=='energy')return 'You are exhausted. Rest or sleep first.';

ch({cash:-cost,happy:3});l.hour+=a[2];l.energy=cl(l.energy-a[2]*5);l.food=cl(l.food-a[2]*4);l.hygiene=cl(l.hygiene-a[2]*2);l[a[3]]=cl(l[a[3]]+a[4]);l.skills[a[5]]=(l.skills[a[5]]||0)+1;l.done[g+i]=true;l.place=a[0];if(l.food<15||l.energy<10)ch({health:-2,happy:-2});let out=`${a[0]} in ${l.city}. ${a[5]} skill +1. `;

],(l.condition||'No ongoing condition')+' · Simplified fiction, not a medical simulation. Care changes your health trend; the world shows a care indicator.');}

body{font-family:system-ui,-apple-system,sans-serif;background:#dce5df}#app{background:var(--bg);box-shadow:0 0 70px #183a2520;isolation:isolate;overflow:hidden}header{padding:12px 16px 8px}.top{gap:8px}.who{gap:9px;min-width:0}.who>div:last-child{min-width:0}h1{font-size:22px;letter-spacing:-.8px;color:var(--ink)}#sb{font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:225px}#nw{font-size:10px}.av{border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);width:46px;height:46px}.cash{font-size:19px;white-space:nowrap}#snd{min-height:28px;padding:2px 8px;font-size:12px}#scene{width:calc(100% - 24px);margin:0 12px;border-radius:15px;border:1px solid var(--line);max-height:155px}

#m{position:absolute;backdrop-filter:blur(5px);background:#14291f77}.p{display:block;border-radius:24px 24px 0 0;padding:12px 15px max(16px,env(safe-area-inset-bottom));max-height:90%;overscroll-behavior:contain;box-shadow:0 -10px 60px #10261a33}.handle{width:34px;height:4px;border-radius:5px;background:var(--line);margin:0 auto 14px!important}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px!important}.sheethead h2{font-size:22px;line-height:1.15;letter-spacing:-.6px;color:var(--ink)}.p .closebtn{padding:8px 12px;min-height:44px;font-size:18px;border:1px solid var(--line)}.sheetnote{font-size:11px;line-height:1.5;margin-bottom:12px!important}.sheetitems{display:grid;gap:7px}.sheetitems>button{width:100%;background:var(--bg);border:1px solid var(--line);font-size:13px;line-height:1.35}.sheetitems>button small{font-size:10px;line-height:1.4;margin-top:4px}.sheetitems.tiles{grid-template-columns:1fr 1fr}.sheetitems.tiles button{min-height:77px}.searchbox{display:block;width:100%;padding:13px 12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font:inherit;font-size:16px;color:var(--ink);margin:0 0 10px;box-sizing:border-box}.filterrow{display:flex;gap:6px;margin-bottom:10px!important}.filterrow button{min-height:38px;padding:6px 10px;font-size:11px}.filterrow button[aria-pressed=true]{background:var(--accent);color:#fff}.emptyhint{font-size:12px;padding:16px}.sheetitems button[hidden]{display:none}.resultnote{position:absolute;left:15px;right:15px;bottom:78px;background:var(--ink);color:var(--card);border-radius:12px;padding:12px;font-size:12px;z-index:11;box-shadow:0 4px 25px #0002;pointer-events:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#182721;--card:#21332a;--ink:#edf3e8;--mute:#b0c1b5;--line:#354c3d;--accent:#62b992}body{background:#101c17}}
:root[data-theme=dark]{--bg:#182721;--card:#21332a;--ink:#edf3e8;--mute:#b0c1b5;--line:#354c3d;--accent:#62b992}
@media(max-height:680px){#scene{max-height:105px}header{padding-top:6px}.lifebar{padding-top:5px}.bars{padding-top:6px;padding-bottom:6px}.need{padding:4px}#sb{-webkit-line-clamp:1}}
</style>
<script>
let lastFocus=null,toastTimer;
function closeSheet(){ $('m').hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus(); }
function toast(text){let t=$('resultnote');if(!t){t=document.createElement('div');t.id='resultnote';t.className='resultnote';t.setAttribute('role','status');$('app').appendChild(t)}t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4200)}
ui=function(title,note,items){const m=$('m');if(m.hidden)lastFocus=document.activeElement;m.hidden=false;m.replaceChildren();const p=document.createElement('section');p.className='p';const handle=document.createElement('div');handle.className='handle';p.appendChild(handle);const head=document.createElement('div');head.className='sheethead';const h=document.createElement('h2');h.id='sheettitle';h.textContent=title;head.appendChild(h);m.setAttribute('aria-labelledby','sheettitle');const canClose=items.some(a=>a[0]==='Close');if(canClose){const c=document.createElement('button');c.className='closebtn';c.textContent='×';c.setAttribute('aria-label','Close menu');c.onclick=closeSheet;head.appendChild(c)}p.appendChild(head);if(note){const d=document.createElement('div');d.className='sheetnote';if(title==='Net worth')d.innerHTML=note;else if(title==='Profile'){const portrait=document.createElement('div');portrait.id='pbig';portrait.style.cssText='width:220px;height:220px;margin:0 auto';d.appendChild(portrait);const desc=document.createElement('div');desc.textContent=S.name+' · '+S.trait+' · age '+S.age;d.appendChild(desc)}else d.textContent=note;p.appendChild(d)}const list=document.createElement('div');list.className='sheetitems'+(['Your everyday life','Activities','Choose your next chapter'].includes(title)?' tiles':'');items.filter(a=>a[0]!=='Close').forEach(([label,fn,hint])=>{const b=document.createElement('button');b.textContent=label;if(hint){const sm=document.createElement('small');sm.textContent=hint;b.appendChild(sm)}b.onclick=()=>{m.hidden=true;const r=typeof fn==='function'?fn():null;if(typeof r==='string'){log(r);feedback(r);toast(r)}draw();dead();if(m.hidden&&lastFocus&&lastFocus.isConnected)lastFocus.focus()};list.appendChild(b)});p.appendChild(list);m.appendChild(p);const first=p.querySelector('button');if(first)first.focus();};
$('m').addEventListener('click',e=>{if(e.target===$('m')&&$('m').querySelector('.closebtn'))closeSheet()});
document.addEventListener('keydown',e=>{const m=$('m');if(m.hidden)return;if(e.key==='Escape'&&m.querySelector('.closebtn'))closeSheet();if(e.key==='Tab'){const f=[...m.querySelectorAll('button,input')].filter(n=>!n.hidden&&!n.disabled);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const compactDraw=draw;draw=function(){compactDraw();if(!S)return;const l=life(),bar=$('lifebar');bar.replaceChildren();const day=document.createElement('div');day.className='dayline';const left=document.createElement('span');left.textContent=`DAY ${l.day} · ${String(l.hour).padStart(2,'0')}:00`;const right=document.createElement('span');right.textContent=l.city+' · '+S.wx;day.append(left,right);bar.appendChild(day);const grid=document.createElement('div');grid.className='needgrid';for(const k of ['food','energy','hygiene','social','calm']){const cell=document.createElement('div');cell.className='need'+(l[k]<25?' low':'');cell.textContent=cap(k);const v=document.createElement('strong');v.textContent=l[k];const track=document.createElement('i'),fill=document.createElement('em');fill.style.width=l[k]+'%';track.appendChild(fill);cell.append(v,track);grid.appendChild(cell)}bar.appendChild(grid);$('acts').textContent=`LIFE JOURNAL  ·  ${S.acts} annual actions left  ·  Daily activities use hours`;};
db.textContent='Explore day';$('act').textContent='Life choices';$('up').textContent='Next year →';$('up').onclick=()=>{if(!S||!S.alive)return;menu('A year goes by',['Advance one year'].map(n=>[n,'Annual income, expenses and life events will be processed.',age]),'Want a new morning instead? Use Sleep in Explore day.');};
const dailyHome=daily;daily=function(){dailyHome();const p=$('m').querySelector('.p');const open=document.createElement('button');open.textContent='⌕ Search all 60 activities';open.style.cssText='width:100%;margin-bottom:10px;background:var(--accent);color:var(--card)';open.onclick=()=>activityBrowser();p.insertBefore(open,p.querySelector('.sheetitems'));};
function activityBrowser(group){const rows=group?DAILY[group].map((a,i)=>({a,i,g:group})):Object.entries(DAILY).flatMap(([g,rs])=>rs.map((a,i)=>({a,i,g})));menu(group||'Find your next activity',[], 'Choose something that fits your day. Prices reflect your current destination.');const p=$('m').querySelector('.p'),list=p.querySelector('.sheetitems');const input=document.createElement('input');input.className='searchbox';input.placeholder='Search activities or skills…';input.setAttribute('aria-label','Search activities');const filters=document.createElement('div');filters.className='filterrow';let mode='All';for(const label of ['All','Available','Free']){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',label===mode);b.onclick=()=>{mode=label;for(const x of filters.children)x.setAttribute('aria-pressed',x.textContent===mode);render()};filters.appendChild(b)}p.insertBefore(input,list);p.insertBefore(filters,list);const render=()=>{list.replaceChildren();const l=life(),city=CITY.find(c=>c[0]===l.city)||CITY[0];let n=0;for(const{a,i,g}of rows){const cost=a[1]>0?Math.round(a[1]*city[4]):a[1];const reason=S.age<a[6]?'Opens at age '+a[6]:l.hour+a[2]>22?'Sleep first':cost>S.cash?'Need '+fmt(cost):l.energy<12&&a[3]!=='energy'?'Rest first':null;if(!((a[0]+' '+a[5]+' '+g).toLowerCase().includes(input.value.toLowerCase()))||mode==='Available'&&reason||mode==='Free'&&cost>0)continue;n++;const b=document.createElement('button');b.textContent=a[0];const sm=document.createElement('small');sm.textContent=`${a[2]}h · ${cost<0?'Earn '+fmt(-cost):cost===0?'Free':fmt(cost)} · ${cap(a[3])} +${a[4]}`+(reason?' · '+reason:'');b.appendChild(sm);b.disabled=!!reason;b.onclick=()=>{const r=perform(g,i);log(r);feedback(r);draw();dead();if(S.alive){render();toast(r)}};list.appendChild(b)}if(!n){const empty=document.createElement('div');empty.className='emptyhint';empty.textContent='No matches. Try another search or filter.';list.appendChild(empty)}};input.oninput=render;render();}
activityMenu=g=>activityBrowser(g);
if(S)draw();else splash();
</script>

<style>

</style>
