<!doctype html><html lang="en"><meta charset="utf-8"><title>City renderer visual checks</title><style>body{margin:0;background:#273b34;color:#e7d7b5;font:14px Arial}canvas{display:block;margin:auto;max-width:100%}</style><canvas id="art"></canvas><script type="module">
import {Simulation} from '../src/sim/Simulation';
import {makeVehicle} from '../src/sim/Traffic';
import {impactComponents} from '../src/sim/VehicleDamage';
import {FLEET_MODELS} from '../src/content/fleet';
import {VEHICLES} from '../src/content/vehicles';

import {drawBuildingTile} from '../src/render/Buildings';
import {drawFacadeDamage} from '../src/render/CivicArt';
import {PROP_KINDS} from '../src/content/streetProps';

import {drawStreetProp} from '../src/render/StreetProps';

const sim=new Simulation({seed:3,midCount:2,backgroundCount:4}),cv=document.querySelector('canvas'),g=cv.getContext('2d'),query=new URLSearchParams(location.search),mode=query.get('mode')??'fleet',page=+(query.get('page')??0),ids=mode==='facades'?['timber','brick','glass','concrete','metal','stone']:mode==='props'?PROP_KINDS:mode==='damage'?Array.from({length:12},()=>query.get('cls')??'supra'):Object.keys(mode==='all'?VEHICLES:FLEET_MODELS).slice(page*24,page*24+24),cols=mode==='props'?6:mode==='facades'?3:4,cw=250,ch=mode==='facades'?250:160,rows=Math.ceil(ids.length/cols),W=cols*cw,H=rows*ch;

for(const [i,id]of ids.entries()){g.save();g.translate(i%cols*cw,Math.floor(i/cols)*ch);g.strokeStyle='#6a7c5e55';g.strokeRect(0,0,cw,ch);g.fillStyle='#e4d8ba';g.font='12px Arial';g.textAlign='center';

</script></html>
