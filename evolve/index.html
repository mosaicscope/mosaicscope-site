<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0b0a">
<title>Evolution Engine · MosaicScope</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #0e0b0a; --ink-2: #1a1412; --paper: #eee4d3; --dim: #9a8d80;
    --red: #ec2a1c; --acid: #c6ff3d; --sodium: #f6b62c; --line: rgba(238, 228, 211, 0.16);
    --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --gut: clamp(16px, 4vw, 48px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--paper); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
  a { color: var(--sodium); }
  .mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: .02em; }
  .dim { color: var(--dim); }
  main { max-width: 1180px; margin: 0 auto; padding: 28px var(--gut) 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  h1 { font: 900 clamp(2.4rem, 1.4rem + 4vw, 4.4rem)/.9 var(--f-display); text-transform: uppercase; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--red); }
  h2 { font: 700 1.35rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1px solid var(--line); padding: 4px 10px; border-radius: 2px; }
  .pill b { font-weight: 500; }
  .m-running { color: var(--acid); border-color: var(--acid); }
  .m-paused { color: var(--sodium); border-color: var(--sodium); }
  .m-stopped, .m-tripped { color: var(--red); border-color: var(--red); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); margin-top: 20px; }
  .card { background: var(--ink-2); border: 1px solid var(--line); padding: 18px; grid-column: span 12; min-width: 0; }
  @media (min-width: 760px) { .c6 { grid-column: span 6; } .c4 { grid-column: span 4; } .c8 { grid-column: span 8; } }
  .agent { position: relative; overflow: hidden; }
  .agent .tag { position: absolute; top: 14px; right: 16px; }
  .agent .pts { font: 900 4rem/1 var(--f-display); margin: 8px 0 4px; }
  .agent.lead .pts { color: var(--acid); }
  .agent p { margin: 0 0 12px; color: var(--dim); }
  dl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 0; }
  dl div { border-top: 1px solid var(--line); padding-top: 6px; }
  dt { color: var(--dim); font: 400 11px/1.2 var(--f-mono); text-transform: uppercase; }
  dd { margin: 2px 0 0; font: 500 1.1rem/1.2 var(--f-mono); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font: 400 11px/1.2 var(--f-mono); text-transform: uppercase; }
  .scroll { overflow-x: auto; }
  .ok { color: var(--acid); } .bad { color: var(--red); } .warn { color: var(--sodium); }
  .meter { height: 8px; background: var(--ink); border: 1px solid var(--line); margin: 6px 0 12px; }
  .meter i { display: block; height: 100%; background: var(--acid); max-width: 100%; }
  .meter.hot i { background: var(--red); }
  .big { font: 700 1.6rem/1.1 var(--f-display); margin: 4px 0; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=password] { background: var(--ink); color: var(--paper); border: 1px solid var(--line); padding: 9px 10px; font: 400 13px var(--f-mono); min-width: 0; flex: 1 1 200px; }
  button { font: 600 13px var(--f-body); text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px; border: 1px solid var(--paper); background: transparent; color: var(--paper); cursor: pointer; }
  button:hover { background: var(--paper); color: var(--ink); }
  button.stop { border-color: var(--red); color: var(--red); }
  button.stop:hover { background: var(--red); color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
  .empty { color: var(--dim); font-style: italic; }
  .notice { border-left: 3px solid var(--sodium); padding: 10px 14px; margin-top: 20px; background: var(--ink-2); }
  .spark { display: flex; align-items: end; gap: 2px; height: 36px; margin-top: 8px; }
  .spark i { flex: 1; background: var(--acid); min-height: 2px; opacity: .8; }
  .spark i.bad { background: var(--red); }
  @media (prefers-reduced-motion: no-preference) { .pulse { animation: p 2s ease-in-out infinite; } @keyframes p { 50% { opacity: .45; } } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="mono dim" style="margin:0 0 6px">MosaicScope / <a href="/">site</a></p>
      <h1>Evolution <span>engine</span></h1>
    </div>
    <div class="status mono" id="status" aria-live="polite"><span class="pill pulse">Loading…</span></div>
  </header>

  <div id="notice"></div>

  <section class="grid" aria-label="Agents">
    <article class="card c6 agent" id="a-innovator"></article>
    <article class="card c6 agent" id="a-optimiser"></article>
  </section>

  <section class="grid">
    <article class="card c8"><h2>Latest improvement</h2><div id="latest"></div></article>
    <article class="card c4"><h2>Controls</h2>
      <form class="controls" id="ctl" autocomplete="off">
        <label class="mono dim" for="tok" style="flex-basis:100%">Admin token</label>
        <input type="password" id="tok" placeholder="EVOLVE_ADMIN_TOKEN">
        <button type="button" data-a="pause">Pause</button>
        <button type="button" data-a="resume">Resume</button>
        <button type="button" data-a="stop" class="stop">Emergency stop</button>
      </form>
      <p class="mono dim" id="ctl-msg" aria-live="polite"></p>
    </article>
  </section>

  <section class="grid">
    <article class="card c6"><h2>Usage today</h2><div id="usage"></div></article>
    <article class="card c6"><h2>Website health</h2><div id="health"></div></article>
  </section>

  <section class="grid">
    <article class="card"><h2>Competitions</h2><div class="scroll" id="proposals"></div></article>
  </section>

  <section class="grid">
    <article class="card c6"><h2>Accepted and rejected</h2><div class="scroll" id="history"></div></article>
    <article class="card c6"><h2>Priorities and known weaknesses</h2><div id="priorities"></div></article>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ago = (t) => { if (!t) return "never"; const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 5 ? "just now" : s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : s < 86400 ? Math.round(s / 3600) + "h ago" : Math.round(s / 86400) + "d ago"; };
  const usd = (n) => "$" + (n || 0).toFixed(4);
  const ROLE = {
    innovator: ["Agent A", "Innovator", "Finds small wins in design, features, accessibility and UX."],
    optimiser: ["Agent B", "Optimiser", "Hunts bugs, waste and risk, and tries to beat A's pick."],
  };
  let data = null, next = 0;

  try { $("tok").value = sessionStorage.getItem("evo-token") || ""; } catch (e) { /* storage blocked */ }

  async function load() {
    try {
      const r = await fetch("/api/evolve", { cache: "no-store" });
      data = await r.json();
    } catch (e) { data = { error: true }; }
    render();
  }

  function render() {
    if (!data || data.error) { $("status").innerHTML = '<span class="pill m-stopped">Dashboard API unreachable</span>'; return; }
    const s = data.state;
    next = data.nextCycle || 0;
    if (!s) {
      $("status").innerHTML = '<span class="pill">Not running yet</span>';
      $("notice").innerHTML = `<div class="notice">${data.configured === false ? esc(data.note) : "The engine hasn't saved any state yet. Deploy the Worker in <code>evolve/worker</code> (see <code>evolve/README.md</code>); the first cycle writes here within two minutes."}</div>`;
      ["a-innovator", "a-optimiser"].forEach((id) => { const k = id.slice(2); $(id).innerHTML = agentHtml(k, null, false); });
      return;
    }
    const mode = s.mode || "running";
    $("status").innerHTML = [
      `<span class="pill m-${esc(mode)}"><b>${esc(mode.toUpperCase())}</b>${s.modeReason ? " · " + esc(s.modeReason) : ""}</span>`,
      `<span class="pill">Next cycle <b id="cd">–</b></span>`,
      `<span class="pill">Last saved <b>${ago(s.lastWrite)}</b></span>`,
      `<span class="pill">Last cycle: ${esc(s.lastCycle?.result || "none")}</span>`,
    ].join("");
    $("notice").innerHTML = data.control && data.control.at > (s.controlAt || 0) ? `<div class="notice">"${esc(data.control.mode)}" was sent ${ago(data.control.at)} and is applied at the next cycle.</div>` : "";
    const A = s.agents || {};
    const lead = (A.innovator?.points || 0) === (A.optimiser?.points || 0) ? "" : (A.innovator?.points || 0) > (A.optimiser?.points || 0) ? "innovator" : "optimiser";
    $("a-innovator").innerHTML = agentHtml("innovator", A.innovator, lead === "innovator");
    $("a-optimiser").innerHTML = agentHtml("optimiser", A.optimiser, lead === "optimiser");
    $("a-innovator").classList.toggle("lead", lead === "innovator");
    $("a-optimiser").classList.toggle("lead", lead === "optimiser");

    const h = (s.history || [])[0];
    const p = s.pending;
    $("latest").innerHTML = (p ? `<p class="warn mono">In flight: ${link(p)} · ${esc(p.label)} on ${esc(p.path)}:${p.line} · ${esc(p.agent)} (score ${p.score}) · waiting on CI / merge</p>` : "") +
      (h ? `<p class="big ${h.outcome === "accepted" ? "ok" : "bad"}">${esc(h.outcome)}: ${esc(h.label || h.remedy)}</p><p class="mono dim">${esc(h.kind)} · ${esc(h.path)} · by ${esc(h.agent)} · ${ago(h.at)}${h.ref ? " · " + esc(h.ref) : ""}${h.note ? " · " + esc(h.note) : ""}</p>` : '<p class="empty">No outcomes yet.</p>');

    const L = s.ledger || {}, lim = data.limits || {};
    const frac = lim.usd ? (L.usd || 0) / lim.usd : 0;
    $("usage").innerHTML = `
      <p class="big">${usd(L.usd)} <span class="mono dim">of ${usd(lim.usd)} daily limit (estimated from reported token usage)</span></p>
      <div class="meter ${frac > .8 ? "hot" : ""}" role="img" aria-label="${Math.round(frac * 100)}% of the daily budget"><i style="width:${Math.min(100, frac * 100)}%"></i></div>
      <dl>
        <div><dt>AI calls</dt><dd>${L.calls || 0}<span class="dim">/${lim.calls}</span></dd></div>
        <div><dt>Tokens in</dt><dd>${L.inTok || 0}</dd></div>
        <div><dt>Tokens out</dt><dd>${L.outTok || 0}</dd></div>
        <div><dt>Out / call</dt><dd>${L.calls ? (L.outTok / L.calls).toFixed(1) : "–"}</dd></div>
        <div><dt>Cycles</dt><dd>${L.cycles || 0}<span class="dim">/${lim.cycles}</span></dd></div>
      </dl>
      <p class="mono dim" style="margin-top:12px">Limits: ${lim.maxIn} in / ${lim.maxOut} out tokens per call · ${lim.failures} failures in a row trips the engine · ${lim.changes} change per cycle · every ${lim.interval}s.
      ${(s.days || []).slice(0, 7).map((d) => `<br>${esc(d.day)}: ${d.calls} calls, ${usd(d.usd)}, ${d.cycles} cycles`).join("")}</p>`;

    const hs = (s.health || []).slice(0, 24).reverse();
    const max = Math.max(1, ...hs.map((x) => x.ms || 0));
    const last = (s.health || [])[0];
    $("health").innerHTML = last ? `
      <p class="big ${last.status === 200 ? "ok" : "bad"}">${last.status === 200 ? "Up" : "Problem: HTTP " + esc(last.status)} <span class="mono dim">${last.ms} ms · ${last.kb} KB · ${ago(last.at)}</span></p>
      <div class="spark" role="img" aria-label="Response times for the last ${hs.length} samples">${hs.map((x) => `<i class="${x.status === 200 ? "" : "bad"}" style="height:${Math.max(6, (x.ms / max) * 100)}%" title="${x.ms} ms, HTTP ${x.status}"></i>`).join("")}</div>
      <p class="mono dim">Sampled every cycle; saved every 15 min or when something looks off.</p>` : '<p class="empty">No health samples yet (set SITE_URL on the Worker).</p>';

    const props = s.proposals || [];
    $("proposals").innerHTML = props.length ? `<table><thead><tr><th>When</th><th>Innovator</th><th>Optimiser</th><th>Winner</th></tr></thead><tbody>${props.map((x) => `<tr>
      <td class="mono">${ago(x.at)}</td><td>${pick(x.innovator)}</td><td>${pick(x.optimiser)}</td><td class="mono ok">${esc(x.winner)}</td></tr>`).join("")}</tbody></table>` : '<p class="empty">No competitions yet. The agents are only asked when there\'s a verified fix to choose between.</p>';

    const hist = s.history || [];
    $("history").innerHTML = hist.length ? `<table><thead><tr><th>Outcome</th><th>Change</th><th>Agent</th></tr></thead><tbody>${hist.map((x) => `<tr>
      <td class="mono ${x.outcome === "accepted" ? "ok" : "bad"}">${esc(x.outcome)}<br><span class="dim">${ago(x.at)}</span></td>
      <td>${esc(x.label || x.remedy)}<br><span class="mono dim">${esc(x.kind)} · ${esc(x.path)}${x.ref ? " · " + esc(x.ref) : ""}${x.note ? " · " + esc(x.note) : ""}</span></td>
      <td class="mono">${esc(x.agent)}<br><span class="dim">${x.score ?? ""}</span></td></tr>`).join("")}</tbody></table>` : '<p class="empty">Nothing accepted or rejected yet.</p>';

    const pr = s.priorities || [], wk = s.weaknesses || [];
    const learned = Object.entries(s.stats?.kinds || {});
    $("priorities").innerHTML =
      (pr.length ? `<ul class="plain">${pr.map((x) => `<li><span class="mono">${x.priority}</span> · ${esc(x.kind)} <span class="mono dim">${esc(x.path)}:${x.line}</span></li>`).join("")}</ul>` : '<p class="empty">Nothing left to fix right now. Cycles skip until something changes.</p>') +
      (learned.length ? `<p class="mono dim" style="margin-top:14px">Learned (landed / failed): ${learned.map(([k, v]) => `${esc(k)} ${v.ok}/${v.fail}`).join(" · ")}</p>` : "") +
      (wk.length ? `<h2 style="margin-top:18px">Needs a person</h2><ul class="plain">${wk.map((x) => `<li>${esc(x.kind)} <span class="mono dim">${esc(x.path)}${x.data && Object.keys(x.data).length ? " " + esc(JSON.stringify(x.data)) : ""}</span></li>`).join("")}</ul>` : "");
    tick();
  }

  function agentHtml(k, a, lead) {
    const [tag, name, blurb] = ROLE[k];
    a = a || {};
    return `<span class="tag mono dim">${tag}${lead ? ' · <span class="ok">leading</span>' : ""}</span><h2>${name}</h2><p>${blurb}</p>
      <div class="pts">${a.points ?? 0}</div><p class="mono">points</p>
      <dl><div><dt>Proposed</dt><dd>${a.proposals || 0}</dd></div><div><dt>Won</dt><dd>${a.wins || 0}</dd></div>
      <div><dt>Accepted</dt><dd class="ok">${a.accepted || 0}</dd></div><div><dt>Rejected</dt><dd class="bad">${a.rejected || 0}</dd></div>
      <div><dt>Regressions</dt><dd class="bad">${a.regressions || 0}</dd></div></dl>`;
  }
  function pick(x) {
    if (!x) return '<span class="dim">sat out</span>';
    return `${esc(x.label)}<br><span class="mono dim">${esc(x.code)} · ${esc(x.kind)} · ${esc(x.path)} · score ${x.score} · ${x.via === "ai" ? esc(x.model) : esc(x.via)}${x.note ? " · " + esc(x.note) : ""}</span>`;
  }
  function link(p) {
    return p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.ref)}</a>` : esc(p.ref);
  }
  function tick() {
    const el = $("cd");
    if (!el || !next) return;
    const s = Math.max(0, Math.round((next - Date.now()) / 1000));
    el.textContent = s ? s + "s" : "now";
    if (!s) next += (data?.limits?.interval || 120) * 1000;
  }

  document.querySelectorAll("#ctl button").forEach((b) => b.addEventListener("click", async () => {
    const token = $("tok").value.trim();
    const a = b.dataset.a;
    if (!token) { $("ctl-msg").textContent = "Enter the admin token first."; return; }
    if (a === "stop" && !confirm("Emergency stop: the engine makes no AI calls and no changes until resumed. Continue?")) return;
    try { sessionStorage.setItem("evo-token", token); } catch (e) { /* storage blocked */ }
    try {
      const r = await fetch("/api/evolve", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ action: a }) });
      const j = await r.json();
      $("ctl-msg").textContent = r.ok ? j.note : "Refused: " + j.error;
      load();
    } catch (e) { $("ctl-msg").textContent = "Couldn't reach the API."; }
  }));

  load();
  setInterval(load, 30000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
