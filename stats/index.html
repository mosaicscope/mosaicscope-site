<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0b0a">
<title>Mosaic Stats</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --desk: #2b2118; --desk-hi: #4a3a2b;
    --case: #1b1b1f; --case-hi: #3a3a42; --case-lo: #0b0b0d;
    --glow: rgba(120, 200, 255, .18);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse 70% 60% at 50% 35%, rgba(255,214,150,.10), transparent 70%),
      radial-gradient(ellipse at 50% 120%, var(--desk-hi), var(--desk) 65%) fixed;
    overflow: hidden; font-family: ui-monospace, Menlo, monospace;
    display: grid; place-items: center; min-height: 100vh;
  }

  /* the room: a warm lamp glow, a faint vignette */
  .room { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }

  /* the whole monitor, tilted in 3D */
  .stage { perspective: 1800px; perspective-origin: 50% 40%; }
  .monitor {
    position: relative; width: min(980px, 94vw); aspect-ratio: 4 / 3.35;
    transform: rotateX(4deg) rotateY(-9deg) rotateZ(-1deg);
    transform-style: preserve-3d;
    transition: transform .6s ease;
    filter: drop-shadow(-30px 40px 40px rgba(0,0,0,.6));
  }
  .monitor:hover { transform: rotateX(2deg) rotateY(-4deg) rotateZ(-.5deg); }

  /* the plastic case: a rounded body with bevels, vents and a chin with a power LED */
  .case {
    position: absolute; inset: 0;
    border-radius: 9% / 11%;
    background:
      linear-gradient(160deg, rgba(255,255,255,.14) 0%, transparent 22%),
      linear-gradient(200deg, transparent 70%, rgba(0,0,0,.45) 100%),
      linear-gradient(180deg, var(--case-hi), var(--case) 55%, var(--case-lo));
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.18),
      inset 0 -6px 14px rgba(0,0,0,.6),
      inset 10px 0 18px rgba(0,0,0,.35),
      0 0 0 2px #050506,
      0 30px 60px rgba(0,0,0,.55);
    transform: translateZ(-40px);
  }
  .case::before { /* bezel lip around the glass */
    content: ""; position: absolute; left: 6%; top: 6%; right: 6%; bottom: 17%;
    border-radius: 6% / 8%;
    background: linear-gradient(160deg, #2a2a30, #0c0c10 60%, #17171c);
    box-shadow: inset 0 0 0 2px #050506, inset 0 0 24px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04);
  }
  .case::after { /* chin: vents, a power LED and a badge */
    content: ""; position: absolute; left: 8%; right: 8%; bottom: 3%; height: 11%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 3px, transparent 3px 9px),
      linear-gradient(180deg, transparent, rgba(0,0,0,.25));
    border-radius: 0 0 6% 6%;
  }
  .led { position: absolute; right: 12%; bottom: 7.5%; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d8ffb0, #3cff5a 45%, #0b5a1a 100%);
    box-shadow: 0 0 6px #3cff5a, 0 0 16px rgba(60,255,90,.6); z-index: 3; animation: led 3.2s infinite; }
  .badge { position: absolute; left: 10%; bottom: 7%; font: 800 10px/1 ui-monospace, monospace; letter-spacing: .3em; color: #6d6a72; z-index: 3; }

  /* the glass: a curved screen that holds the stats page */
  .screen-wrap {
    position: absolute; left: 10.5%; right: 10.5%; top: 10.5%; bottom: 21%;
    border-radius: 9% / 11%;
    overflow: hidden; background: #050508;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      inset 0 0 60px rgba(0,0,0,.95),
      0 0 40px var(--glow);
    transform: translateZ(2px);
  }
  .screen-wrap iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block;
    filter: contrast(1.05) saturate(1.1) brightness(1.02);
  }
  /* CRT texture on top of the page: scanlines, a subtle shadow mask, bloom at the edges */
  .crt { position: absolute; inset: 0; pointer-events: none; z-index: 4; border-radius: inherit;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(255,0,0,.035) 0 1px, rgba(0,255,0,.03) 1px 2px, rgba(0,0,255,.035) 2px 3px);
    mix-blend-mode: multiply; }
  .crt::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%); }
  /* glass reflection: two soft streaks that move a little */
  .glass { position: absolute; inset: 0; pointer-events: none; z-index: 5; border-radius: inherit;
    background:
      linear-gradient(115deg, transparent 22%, rgba(255,255,255,.10) 30%, transparent 38%),
      linear-gradient(115deg, transparent 58%, rgba(255,255,255,.05) 64%, transparent 70%);
    animation: sheen 9s ease-in-out infinite alternate; }
  .flicker { position: absolute; inset: 0; pointer-events: none; z-index: 6; background: rgba(120,190,255,.025); animation: flick 0.12s steps(2) infinite; }

  /* the desk: a lamp, a cable, a keyboard silhouette */
  .desk-item { position: fixed; pointer-events: none; }
  .cable { right: 6vw; bottom: 18vh; width: 240px; height: 60px; border-bottom: 6px solid #0b0a0a; border-radius: 0 0 160px 0; transform: rotate(-4deg); opacity: .85; }
  .lamp { right: 4vw; top: 12vh; width: 90px; height: 120px; background: linear-gradient(90deg, #5e5e66, #d8d8df 40%, #6a6a72);
    clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); opacity: .6; filter: blur(.4px); }

  /* a little link back to the raw numbers, outside the screen */
  .caption { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: #b7a48a; font-size: 12px; letter-spacing: .08em; text-shadow: 0 1px 0 #000; z-index: 10; }
  .caption a { color: #ffd38a; }

  @keyframes led { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  @keyframes sheen { from { transform: translateX(-4%) } to { transform: translateX(4%) } }
  @keyframes flick { 0% { opacity: .9 } 50% { opacity: 1 } 100% { opacity: .95 } }

  /* phones: no 3D tilt, the screen fills the view */
  @media (max-width: 720px) {
    body { display: block; overflow: auto; background: #050508; }
    .stage { perspective: none; height: 100vh; }
    .monitor { transform: none; width: 100vw; height: 100vh; aspect-ratio: auto; filter: none; }
    .case, .case::before, .case::after, .led, .badge, .cable, .lamp, .room, .flicker, .glass { display: none; }
    .screen-wrap { left: 0; right: 0; top: 0; bottom: 0; border-radius: 0; box-shadow: none; }
    .crt { opacity: .6; }
    .caption { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .monitor, .led, .glass, .flicker { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="room" aria-hidden="true"></div>
  <div class="cable desk-item" aria-hidden="true"></div>
  <div class="lamp desk-item" aria-hidden="true"></div>

  <main class="stage">
    <div class="monitor" role="region" aria-label="Stats monitor">
      <div class="case" aria-hidden="true"></div>
      <div class="screen-wrap">
        <iframe src="/stats/screen.html" title="Mosaic stats desktop" loading="eager"></iframe>
        <div class="crt" aria-hidden="true"></div>
        <div class="glass" aria-hidden="true"></div>
        <div class="flicker" aria-hidden="true"></div>
      </div>
      <div class="led" aria-hidden="true"></div>
      <div class="badge" aria-hidden="true">MOSAIC</div>
    </div>
  </main>

  <p class="caption">Live stats from the last 30 days · <a href="/api/egg?format=json">raw JSON</a></p>
</body>
</html>
